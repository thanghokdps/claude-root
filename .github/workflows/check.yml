name: kit-check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/test_lint_kit.py
      - run: python3 scripts/test_skill_progress.py
      - run: python3 scripts/lint-kit.py
      - run: python3 scripts/eval-triggers.py
