name: kit-check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pillow -r eval/requirements.txt
      # Same checks as before a commit; `claude plugin validate` skips itself when the CLI is absent.
      - run: bash scripts/check.sh
