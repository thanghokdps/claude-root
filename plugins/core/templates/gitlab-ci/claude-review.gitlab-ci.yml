# Claude MR review for GitLab — the GitLab equivalent of "@claude review" on GitHub.
# Based on https://code.claude.com/docs/en/gitlab-ci-cd (beta).
#
# Setup (once per repo):
#   1. Settings → CI/CD → Variables:
#        ANTHROPIC_API_KEY     masked (+ protected if MRs come from protected branches only)
#        GITLAB_REVIEW_TOKEN   masked — Project Access Token, role Reporter+, scope `api` (posts the MR note)
#   2. In .gitlab-ci.yml:   include: { local: '.gitlab/claude-review.gitlab-ci.yml' }   and add stage `ai`.
#
# Triggers: every MR pipeline, or run manually (CI/CD → Run pipeline) with AI_FLOW_INPUT="<question>"
# and CI_MERGE_REQUEST_IID set. The `ultracode` keyword does not work here (prompts via -p are not human-typed).
# Claude only gets read-only tools; the note is posted by curl below, not by Claude.

claude-review:
  stage: ai
  image: node:24-alpine3.21
  timeout: 15m
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT != "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_MERGE_REQUEST_IID'
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git curl jq bash
    - npm install -g @anthropic-ai/claude-code
  script:
    - BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/$CI_DEFAULT_BRANCH}"
    - git diff --stat "$BASE"...HEAD
    - >
      claude -p "${AI_FLOW_INPUT:-Review the changes in git diff $BASE...HEAD for MR !$CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_TITLE.
      Walk this order and do not skip ahead: 1 correctness, 2 tests (is there a test that fails without the change?), 3 scale (races, a query per item, unbounded growth at the expected load), 4 readability, 5 security basics (input validation, secrets, injection, authz), 6 scope (every line traces to the MR title/description).
      Number the findings. Each names file:line, the concrete input or state that fails, the fix, and what skipping it costs; no concrete case, no finding, so never pad the list. A comment shortcut: <limit>, <when to upgrade> is a decision, not a finding. A clean MR is Looks good plus one line on what you checked. End with Verdict and Not checked. Follow CLAUDE.md if present. Output Markdown only.}"
      --allowedTools "Read" "Grep" "Glob" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)"
      --max-turns 25
      > review.md
    - test -s review.md
    - >
      jq -n --rawfile body review.md '{body: ("### 🤖 Claude review\n\n" + $body)}' |
      curl --fail-with-body -sS -X POST
      -H "PRIVATE-TOKEN: $GITLAB_REVIEW_TOKEN" -H "Content-Type: application/json"
      --data @- "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
  artifacts:
    when: always
    paths: [review.md]
    expire_in: 1 week
  allow_failure: true
